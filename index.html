<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRUD Productos</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<style>
body{font-family:Nunito;background:#f1f5f9;margin:0}
.container{max-width:1000px;margin:30px auto;padding:0 20px}
.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:24px}
.btn-guardar{background:#4f46e5;color:#fff;border:none;padding:10px 20px;border-radius:8px}
.btn-editar{background:#f59e0b;color:#fff;border:none;padding:5px 13px}
.btn-eliminar{background:#ef4444;color:#fff;border:none;padding:5px 13px}
.cat-badge{background:#e0e7ff;color:#3730a3;padding:3px 10px;border-radius:20px}
.estado-si{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px}
.estado-no{background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:20px}
.sin-datos{text-align:center;padding:40px;color:#94a3b8}
</style>

</head>
<body>

<div class="container">

<div class="card">
<h2>
<i class="fa-solid fa-pen-to-square"></i>
<span id="form-titulo">Agregar Producto</span>
</h2>

<input id="inp-nombre" placeholder="Nombre"><br><br>
<input id="inp-descripcion" placeholder="Descripción"><br><br>
<input id="inp-precio" type="number" placeholder="Precio"><br><br>
<input id="inp-stock" type="number" placeholder="Stock"><br><br>

<select id="inp-categoria"></select><br><br>

<label>
<input type="checkbox" id="inp-disponible" checked>
Disponible
</label><br><br>

<button class="btn-guardar" onclick="guardar()">
<i class="fa-solid fa-floppy-disk"></i> Guardar
</button>

<button id="btn-cancelar" onclick="cancelar()" style="display:none">
<i class="fa-solid fa-xmark"></i> Cancelar
</button>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-clipboard-list"></i>
Lista de Productos (<span id="total">0</span>)
</h2>

<input id="filtro-buscar" placeholder="Buscar" oninput="renderTabla()"><br><br>

<select id="filtro-categoria" onchange="renderTabla()"></select>

<select id="filtro-disponible" onchange="renderTabla()">
<option value="">Todos</option>
<option value="true">Disponibles</option>
<option value="false">No disponibles</option>
</select>

<br><br>

<div id="tabla-container"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>

</body>
</html>
